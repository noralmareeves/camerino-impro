<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camerino: practica improvisar antes de salir a escena</title>
<style>
:root{--bg:#fbf7f2;--fg:#231f2b;--cd:#fff;--ac:#6b3fa0;--bd:#cfc6d8;--g:#1d7a3f;--y:#8a5a00;--r:#b3261e;--b:#1b5fa8;--fs:18px;--lh:1.5;--ff:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-th=light]):not([data-th=hc]){--bg:#17141d;--fg:#f3eef8;--cd:#231f2d;--ac:#c9a7ff;--bd:#4a4258;--g:#6fd69a;--y:#f0c36a;--r:#ff9a92;--b:#8ec1ff}}
:root[data-th=dark]{--bg:#17141d;--fg:#f3eef8;--cd:#231f2d;--ac:#c9a7ff;--bd:#4a4258;--g:#6fd69a;--y:#f0c36a;--r:#ff9a92;--b:#8ec1ff}
:root[data-th=hc]{--bg:#fff;--fg:#000;--cd:#fff;--ac:#000;--bd:#000;--g:#005a1f;--y:#6b4300;--r:#8f0000;--b:#00408a}
:root[data-ff=easy]{--ff:Verdana,Tahoma,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/var(--lh) var(--ff)}
main,header{max-width:760px;margin:0 auto;padding:12px 16px}
h1{font-size:1.5em;margin:.3em 0}h2{font-size:1.25em;margin:.4em 0}
.cd{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button,select,input{font:inherit;color:var(--fg)}
button{background:var(--cd);border:2px solid var(--ac);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;margin:4px 4px 4px 0}
button.pr{background:var(--ac);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,h2:focus-visible,[data-f]:focus-visible{outline:4px solid var(--b);outline-offset:2px}
.mv{display:block;width:100%;text-align:left;margin:8px 0}
.mv small{display:block;opacity:.85}
details{border:2px solid var(--bd);border-radius:12px;padding:8px 12px;background:var(--cd)}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
label{display:block;margin:8px 0}select,input[type=text]{width:100%;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--cd)}
</style></head><body>
<header><details><summary>⚙️ Ajusta el juego a ti</summary>
<p>Cambia lo que necesites. No tienes que explicar por qué.</p>
<label>Tamaño de letra<select data-s="fs"><option value="18px">Normal</option><option value="22px">Grande</option><option value="27px">Muy grande</option></select></label>
<label>Espacio entre líneas<select data-s="lh"><option value="1.5">Normal</option><option value="1.9">Amplio</option></select></label>
<label>Contraste<select data-s="th"><option value="auto">Normal</option><option value="hc">Alto</option><option value="dark">Modo oscuro</option></select></label>
<label>Tipo de letra<select data-s="ff"><option value="std">Estándar</option><option value="easy">Lectura fácil</option></select></label>
<label>Audio<select data-s="audio"><option value="off">Desactivado</option><option value="on">Activado</option></select></label>
<button data-a="reset">Volver a lo normal</button></details></header>

<main id="app"></main>

<script>
const C=[
{n:"La llave del faro",w:"Marta",r:"En este faro, los objetos cotidianos guardan secretos de quienes los usaron.",l:"El pasillo de un faro",s:"Dos vecinos, el pasillo de un faro, una llave que nadie debería tener.",t:[{o:"¡Por fin encontré la llave del faro! ¡Estaba dentro de mi sombrero!",m:[["¡Sí! Y dentro del sombrero también hay un mapa.","¡UN MAPA! ¡Lo sabía! Está cosido al forro y tiene una cruz roja.","🎩🗺️"],["Sí, la encontraste, pero parece muy vieja.","Tienes razón, está oxidada. Pero algo abrirá, seguro.","🗝️"]]}]},
{n:"El bus de las horas",w:"Baltasar",r:"En este bus el tiempo se vende por piezas: horas, ayeres, silencios.",l:"Un bus interprovincial nocturno",s:"Un bus nocturno, una hora de sobra a la venta, una última parada.",t:[{o:"¡Pasen, pasen, mis panas! Vendo una hora de sobra a una lata. Se usa una sola vez y no hay devoluciones.",m:[["¡La compro! Y la uso para ver el amanecer desde el bus.","¡Cliente con visión! El amanecer va incluido en el precio.","🌅"],["La compro, pero ¿cómo sé que es una buena hora?","Se nota: pasa despacito. Escuche.","⏳"]]}]},
{n:"La vendedora de La Bahía",w:"Lía",r:"En este puesto de La Bahía lo imposible es mercancía normal.",l:"Un puesto en La Bahía, en Guayaquil",s:"Un puesto de La Bahía, una nube a la venta, una tormenta que se acerca.",t:[{o:"¡Última nube del día, mi vida! Recién cortada, a cinco latas. Solo queda una, así que decídete rápido.",m:[["¡Me la llevo! Y también quiero un trocito de arcoíris.","¡Eso lo guardo para clientes de confianza! Pero hoy te lo dejo en oferta.","☁️🌈"],["Quiero la nube, pero no tengo dónde guardarla.","Tengo frascos grandes. Eso sí, no le des la espalda.","🫙"]]}]},
{n:"La sala de espera del Seguro",w:"Inés",r:"En esta sala esperar es una forma de avanzar: las puertas se abren cuando alguien se anima.",l:"La sala de espera de un centro del Seguro",s:"La sala de espera del Seguro, un turno que nunca llaman, una puerta que se abre sola.",t:[{o:"Disculpa… ¿tú también tienes el turno cero? Nadie lo ha llamado nunca.",m:[["Sí, y creo que hoy lo van a llamar. Por eso vine temprano.","¡Qué valiente! Yo llevo aquí desde antes de que existiera esta sala.","0️⃣📺"],["Sí, tengo el cero, pero quizá es un error de impresión.","Puede ser… pero la impresora se veía muy segura.","🧾"]]}]},
{n:"El botón rojo",w:"Tita",r:"En este museo, cada botón prohibido activa una sorpresa que alguien escondió con cariño.",l:"La sala de control de un museo cerrado",s:"Una sala de control, un botón prohibido, alguien que no sabe esperar.",t:[{o:"¡Mira, un botón rojo que dice NO TOCAR! Yo lo toco primero y pienso después.",m:[["Sí, y yo sostengo la cuerda por si algo cae.","¡Equipo! Tú la cuerda, yo el botón. A la una, a las dos…","🪢🔴"],["Sí, tócalo, pero con mucho cuidado.","¿Cuidado? Bueno, lo toco con un solo dedo. Un dedito prudente.","☝️"]]}]},
{n:"La tienda de doña Rosa",w:"Doña Rosa",r:"En esta tienda no se paga con dinero sino con favores y cuentos.",l:"Una tienda de barrio en Guayaquil",s:"Una tienda de barrio, una libreta de favores, alguien que viene a pagar una deuda.",t:[{o:"Buenos días, mijo. Aquí tengo su cuenta: usted me debe un favor desde el invierno pasado.",m:[["Es verdad, y vengo a pagarlo. Le traje pan para toda la cuadra.","¡Qué detalle! Con eso salda el favor y además se gana otro de mi parte.","🥖📒"],["Es verdad, pero no recuerdo cuál era el favor.","Con calma, lo anoté aquí: era cuidar mi tienda un domingo.","📒"]]}]},
{n:"El parque de las iguanas",w:"Chela",r:"En este parque las iguanas son las vecinas más antiguas: llevan siglos mirando.",l:"Un parque con iguanas en el centro de Guayaquil",s:"Un parque con iguanas, una guía muy seria, una iguana que sabe algo que nadie recuerda.",t:[{o:"Bienvenidos al parque, mis panas. Les presento a doña Iguana, la más antigua.",m:[["Mucho gusto, doña Iguana. Y traje hojas de su postre favorito.","¡Eso la conquista! Mire cómo mueve la cola: le cae bien.","🦎🍃"],["Mucho gusto, pero no parece tener tantos años.","Las iguanas envejecen por dentro. Mírele los ojos.","👁️"]]}]},
{n:"El taxista que ya sabe",w:"Don Julio",r:"En este taxi el taxista sabe tu destino antes que tú.",l:"Un taxi en una avenida de Guayaquil",s:"Un taxi, un destino que nadie dijo, un taxista que ya sabe.",t:[{o:"Buenas, pana. No me diga a dónde va, yo ya sé, y la carrera sale en tres latas.",m:[["¡Eso! Ahora sí vamos por buen camino.","Puede ser… vamos despacio y vemos.","🚕✨"],["Ya, ya, no se enoje. Doy la vuelta, el taxi aguanta.","Buena pregunta. Yo manejo, usted decide el resto.","🚕🛑"]]}]},
{n:"El carrito de agua de coco",w:"Doña Mery",r:"En este carrito cada coco trae un consejo escondido.",l:"Un carrito de agua de coco junto a un parque",s:"Un carrito de coco, un consejo escondido, alguien con mucha sed.",t:[{o:"Fresquito el cocito, a una lata, mijo. Y hoy trae un consejo de yapa, ¿se lo abro?",m:[["¡Qué bien! Con esa idea el coco queda más rico.","Escuche lo que dice el coco: dice que usted ya sabe qué hacer.","🥥✨"],["Mmm, puede ser… probemos con una pajita más.","Ya se terminó el agua, pero el consejo todavía no.","🥥🧊"]]}]},
{n:"Se fue la luz",w:"Don Pepe",r:"En esta oscuridad, lo que se dice en voz alta se vuelve verdad por un rato.",l:"El pasillo de un edificio sin luz",s:"Un pasillo sin luz, una vela, vecinos que no se conocían.",t:[{o:"¡Se fue la luz, qué ruina! Tranquilos, panas, yo tengo una vela y una idea.",m:[["¡Eso! La oscuridad ya sirve para algo.","Mire cómo se ven las caras con una sola llama.","🕯️✨"],["Puede ser… pero hablemos bajito, por si acaso.","La luz ya volvió… pero nadie quiere moverse. ¿Y ahora?","🕯️🌑"]]}]},
{n:"La peluquería del barrio",w:"Doña Sonia",r:"En esta peluquería cada corte quita algo más que pelo: un mal rato.",l:"Una peluquería de barrio",s:"Una peluquería de barrio, un espejo que escucha, un mal humor que se va.",t:[{o:"Siéntese, mijo. El corte son cinco latas y el mal rato va de yapa. ¿Qué le cortamos hoy?",m:[["¡Ay, eso me encanta! Ahora el espejo sonríe.","Cierre los ojos. Tijera va… y ya se cayó una preocupación.","✂️✨"],["Puede ser… una puntita no más, para probar.","Mírese en el espejo. Hay alguien que lo está esperando.","✂️"]]}]},
{n:"La lancha por el estero",w:"Capitán Nelson",r:"En este estero cruzas de un lado a otro, y la otra orilla guarda lo pendiente.",l:"Una lancha cruzando un estero",s:"Una lancha, un estero, una orilla donde espera algo pendiente.",t:[{o:"Suba, suba, ñaño. El cruce sale en dos latas, y la otra orilla del día va de yapa.",m:[["¡Eso! La lancha avanza más ligera.","Mire el agua: lleva algo que usted dejó pendiente.","🛶✨"],["Puede ser… vamos despacio, que el agua manda.","Ya casi llegamos. ¿Se baja o se queda otro rato?","🛶"]]}]},
{n:"El Malecón y la cámara",w:"Fabián",r:"En este Malecón la cámara muestra lo que cada persona lleva por dentro.",l:"El Malecón al atardecer",s:"El Malecón, una cámara que ve lo invisible, una foto que no sale como se esperaba.",t:[{o:"Quieta, quieta, pana. Esta cámara no retrata la cara, retrata lo que lleva adentro.",m:[["¡Eso! La foto salió mejor de lo esperado.","Mire la foto: salió algo que usted no sabía que cargaba.","📸✨"],["Puede ser… la foto salió borrosa, probemos otra.","El atardecer ya se va. ¿La imprimo o se la lleva así?","📸"]]}]},
{n:"El encebollado de madrugada",w:"Doña Marlene",r:"En este puesto cada plato cura el mal que traes, aunque no se lo hayas contado a nadie.",l:"Un puesto de encebollado de madrugada",s:"Un puesto de encebollado, un plato que cura, un mal que nadie ha dicho en voz alta.",t:[{o:"Buenas madrugadas, mijo. ¿Y qué mal trae hoy? No me diga, ya lo huelo; para eso está la jama.",m:[["¡Eso! Con eso hasta el encebollado sabe mejor.","Aquí está su encebollado, bien calientito, a tres latas.","🍲✨"],["Puede ser… pruébelo y me dice.","Ya terminó el plato. Y mire: el mal se fue, pero le dejó una pregunta.","🍲"]]}]},
{n:"La cabina detenida",w:"Rocío",r:"En esta cabina detenida el tiempo se alarga y la conversación se vuelve lo principal.",l:"Una cabina detenida en la Aerovía, con la ciudad abajo",s:"Una cabina detenida, la ciudad abajo, una conversación que no estaba prevista.",t:[{o:"Chuta, se paró la cabina. Mire cuánta ciudad hay abajo, nunca la había visto así.",m:[["¡Eso! La cabina se siente más cómoda ahora.","Mientras esperamos, cuénteme algo que nunca le haya contado a nadie.","🚀✨"],["Puede ser… pero no miremos hacia abajo todavía.","Parece que ya vuelve a andar. ¿Quiere que se detenga otro ratito?","🚀"]]}]},
{n:"La parada de la Metrovía",w:"Don Alfonso",r:"En esta parada el bus siempre está por llegar, y la espera junta a quienes nunca hablarían.",l:"Una parada de la Metrovía",s:"Una parada de la Metrovía, un bus que ya viene, una espera que junta a desconocidos.",t:[{o:"Ya viene, ya viene, pana. Aquí llevo esperando desde antes de que usted llegara.",m:[["¡Eso! Con eso la espera pasa más rápida.","Mire, el bus viene lleno. Pero hay un sitio… hecho para usted.","🚌✨"],["Puede ser… esperemos un poquito más a ver.","Se fue el bus. Pero fíjese: la espera nos hizo amigos.","🚌"]]}]}
];

const S={fs:"18px",lh:"1.5",th:"auto",ff:"std",audio:"off"};
let G={c:0,t:0,scr:"home",cur:null,nx:null};

function apply(){
  const r=document.documentElement;
  r.style.setProperty("--fs",S.fs);
  r.style.setProperty("--lh",S.lh);
  r.dataset.th=S.th==="auto"?"":S.th;
  r.dataset.ff=S.ff;
}

function getIAResponse(charName, userText) {
    const text = userText.toLowerCase();
    let reply = "";
    let emoji = "🎭";
    
    if(text.includes("hola") || text.includes("buenos") || text.includes("buenas")) {
        reply = `¡Hola, pana! Soy ${charName}. Qué bueno verte por aquí. ¿Listo para improvisar?`;
        emoji = "👋";
    } else if(text.includes("por qué") || text.includes("cómo") || text.includes("cuál")) {
        reply = "Buena pregunta, mijo. Las cosas aquí se explican con ganas y al toque.";
        emoji = "🤔";
    } else if(text.includes("no") || text.includes("nunca")) {
        reply = "Chuta, qué firme estás. Pero en este escenario las reglas cambian rapidito.";
        emoji = "🛑";
    } else {
        const repletas = [
            "¡Eso mismo! Dímelo otra vez con más confianza, que la escena va cogiendo cuerpo.",
            "De ley, mijo. Eso no me lo esperaba, pero me gusta cómo suena.",
            "¡Ayayay! Con eso que dices, la historia da un giro total.",
            "Full bacán lo que propones. Sigue por esa línea, que te sigo el juego."
        ];
        reply = repletas[Math.floor(Math.random() * repletas.length)];
        emoji = "✨";
    }
    return { text: reply, emoji: emoji };
}

function draw(){
  apply();
  const A = document.getElementById("app");
  if (!A) return;
  let h="";
  if(G.scr==="home"){
    h+=`<h1>Camerino</h1><p>Práctica de improvisación actoral antes de salir a escena. Elige un espacio:</p>`;
    C.forEach((x,i)=>{
      h+=`<button class="mv" data-go="${i}"><strong>${x.n}</strong> — con ${x.w} (${x.l})</button>`;
    });
  }else if(G.scr==="play"){
    const sc=C[G.c];
    const turn=sc.t[G.t] || sc.t[0];
    h+=`<h2>${sc.n} (${sc.w})</h2><p><em>${sc.r}</em></p>`;
    h+=`<div class="cd"><strong>Situación:</strong> ${sc.s}</div>`;
    h+=`<div class="cd"><strong>${sc.w}:</strong> ${turn.o}</div>`;
    
    if(G.cur){
      h+=`<div class="cd" style="background:var(--bg); border-color:var(--ac)"><strong>Tú dijiste:</strong> ${G.cur}</div>`;
      h+=`<div class="cd" style="background:var(--cd);"><strong>${sc.w}:</strong> ${G.nx.text} ${G.nx.emoji}</div>`;
      h+=`<button class="pr" data-a="next_turn">Siguiente situación →</button>`;
    } else {
      h+=`<p>¿Qué respondes o haces?</p>`;
      turn.m.forEach((opt, idx)=>{
        h+=`<button data-opt="${idx}" style="display:block; width:100%; text-align:left; margin-bottom:8px;">${opt[0]}</button>`;
      });
      h+=`<hr style="margin:16px 0; border:none; border-top:1px solid var(--bd);">`;
      h+=`<p><small>O escribe tu propia línea de improvisación:</small></p>`;
      h+=`<input type="text" id="custom_input" placeholder="Escribe tu respuesta aquí..." style="margin-bottom:8px;">`;
      h+=`<button class="pr" data-a="send_custom">Responder con mi texto</button>`;
    }
    h+=`<br><button data-a="home" style="margin-top:20px;">← Volver al inicio</button>`;
  }
  A.innerHTML=h;
}

document.addEventListener("click", e=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  const go = btn.getAttribute("data-go");
  const act = btn.getAttribute("data-a");
  const optIdx = btn.getAttribute("data-opt");
  
  if(go!==null){
    G.c = parseInt(go,10);
    G.scr = "play";
    G.t = 0;
    G.cur = null;
    G.nx = null;
    draw();
  } else if(act==="home"){
    G.scr="home";
    draw();
  } else if(act==="next_turn"){
    G.t++;
    const sc=C[G.c];
    if(G.t >= sc.t.length) G.t = 0;
    G.cur = null;
    G.nx = null;
    draw();
  } else if(optIdx!==null){
    const sc=C[G.c];
    const turn=sc.t[G.t] || sc.t[0];
    const chosen = turn.m[parseInt(optIdx,10)];
    G.cur = chosen[0];
    G.nx = { text: chosen[1], emoji: chosen[2] };
    draw();
  } else if(act==="send_custom"){
    const input = document.getElementById("custom_input");
    if(input && input.value.trim() !== ""){
      const userText = input.value.trim();
      const sc = C[G.c];
      const aiRes = getIAResponse(sc.w, userText);
      G.cur = userText;
      G.nx = aiRes;
      draw();
    }
  } else if(act==="reset"){
    S.fs="18px"; S.lh="1.5"; S.th="auto"; S.ff="std"; S.audio="off";
    draw();
  }
});

document.addEventListener("DOMContentLoaded", draw);
draw();
</script></body></html>
