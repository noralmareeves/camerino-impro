<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camerino: Práctica de Improvisación</title>
<style>
body { font-family: system-ui, sans-serif; background: #fbf7f2; color: #231f2b; max-width: 700px; margin: 0 auto; padding: 20px; line-height: 1.6; }
.cd { background: #fff; border: 2px solid #cfc6d8; border-radius: 12px; padding: 16px; margin: 12px 0; }
button { font: inherit; background: #fff; border: 2px solid #6b3fa0; border-radius: 10px; padding: 12px 16px; cursor: pointer; margin: 6px 0; display: block; width: 100%; text-align: left; }
button.pr { background: #6b3fa0; color: #fff; text-align: center; }
input[type="text"] { width: 100%; padding: 12px; border: 2px solid #cfc6d8; border-radius: 10px; font: inherit; margin: 8px 0; box-sizing: border-box; }
</style>
</head>
<body>

<h1>Camerino</h1>
<p>Práctica de improvisación actoral antes de salir a escena.</p>
<div id="app"></div>

<script>
const C = [
  { n: "La llave del faro", w: "Marta", r: "En este faro, los objetos cotidianos guardan secretos.", s: "Dos vecinos, el pasillo de un faro, una llave que nadie debería tener.", o: "¡Por fin encontré la llave del faro! ¡Estaba dentro de mi sombrero!" },
  { n: "El bus de las horas", w: "Baltasar", r: "En este bus el tiempo se vende por piezas.", s: "Un bus nocturno, una hora de sobra a la venta.", o: "¡Pasen, pasen, mis panas! Vendo una hora de sobra a una lata." },
  { n: "La vendedora de La Bahía", w: "Lía", r: "En este puesto de La Bahía lo imposible se vende como fruta.", s: "Un puesto en La Bahía, una nube a la venta.", o: "¡Última nube del día, mi vida! Recién cortada, a cinco latas." }
];

let G = { scr: "home", c: 0, log: [] };

function draw() {
  let h = "";
  if (G.scr === "home") {
    h += "<h2>Elige un espacio para ensayar:</h2>";
    C.forEach((x, i) => {
      h += `<button onclick="start(${i})"><strong>${x.n}</strong> — con ${x.w} (${x.l || 'Guayaquil'})</button>`;
    });
  } else if (G.scr === "play") {
    let sc = C[G.c];
    h += `<h2>${sc.n} (${sc.w})</h2>`;
    h += `<div class="cd"><strong>Situación:</strong> ${sc.s}</div>`;
    h += `<div class="cd" style="background:#f3eef8;"><strong>${sc.w}:</strong> "${sc.o}"</div>`;
    
    if (G.log.length > 0) {
      h += `<div class="cd" style="border-color:#1d7a3f;"><strong>Tú:</strong> "${G.log[G.log.length-1].user}"<br><br><strong>${sc.w}:</strong> "${G.log[G.log.length-1].ai}" ✨</div>`;
      h += `<button class="pr" onclick="resetGame()">← Elegir otra escena</button>`;
    } else {
      h += `<p>Escribe tu respuesta de improvisación:</p>`;
      h += `<input type="text" id="userTxt" placeholder="Ej: Sí, y además traje una cuerda...">`;
      h += `<button class="pr" onclick="sendText()">Responder a ${sc.w}</button>`;
      h += `<button onclick="resetGame()" style="margin-top:10px;">← Volver</button>`;
    }
  }
  document.getElementById("app").innerHTML = h;
}

function start(i) {
  G.c = i;
  G.scr = "play";
  G.log = [];
  draw();
}

function sendText() {
  let txt = document.getElementById("userTxt").value.trim();
  if (!txt) return;
  
  let sc = C[G.c];
  let respuestasIA = [
    "¡Eso mismo, pana! Dímelo otra vez con más confianza, que la escena va cogiendo cuerpo.",
    "De ley, mijo. Eso no me lo esperaba, pero me gusta cómo suena.",
    "¡Ayayay! Con eso que dices, la historia da un giro total.",
    "Full bacán lo que propones. Sigue por esa línea, que te sigo el juego."
  ];
  let aiReply = respuestasIA[Math.floor(Math.random() * respuestasIA.length)];
  
  G.log.push({ user: txt, ai: aiReply });
  draw();
}

function resetGame() {
  G.scr = "home";
  G.log = [];
  draw();
}

draw();
</script>

</body>
</html>
